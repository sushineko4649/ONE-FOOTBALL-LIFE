<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONE FOOTBALL LIFE</title>
  <style>
/* =========================================================
   ONE FOOTBALL LIFE - style
   ========================================================= */
:root {
  --bg: #0b1512;
  --bg2: #10201b;
  --card: #152a23;
  --card2: #1b352c;
  --line: #2a4a3e;
  --text: #e8f1ec;
  --sub: #9bb5aa;
  --accent: #3ddc84;
  --accent2: #f5c542;
  --danger: #ff6b6b;
  --info: #5fb3ff;
  --radius: 12px;
  --font: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", "Meiryo", system-ui, sans-serif;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background:
    repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0 60px, transparent 60px 120px),
    radial-gradient(ellipse at top, #16322a 0%, var(--bg) 60%);
  background-attachment: fixed;
  color: var(--text);
  font-family: var(--font);
  font-size: 15px;
  line-height: 1.6;
  min-height: 100vh;
}
button { font-family: inherit; }
b { color: #fff; }

/* ---------- ボタン ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: 10px; border: 1px solid var(--line);
  background: var(--card2); color: var(--text); font-size: 15px; cursor: pointer;
  transition: transform .08s, background .15s, border-color .15s;
}
.btn:hover { background: #22443a; border-color: var(--accent); }
.btn:active { transform: scale(.97); }
.btn.primary { background: var(--accent); color: #062014; border-color: var(--accent); font-weight: 700; }
.btn.primary:hover { background: #5ff09e; }
.btn.ghost { background: transparent; }
.btn.danger { border-color: var(--danger); color: var(--danger); background: transparent; }
.btn.small { padding: 6px 12px; font-size: 13px; }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btns { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 16px; }

/* ---------- タイトル ---------- */
.title-screen {
  min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center;
  padding: 24px 16px; text-align: center;
}
.title-ball { font-size: 56px; animation: bounce 2.4s ease-in-out infinite; }
@keyframes bounce { 0%,100% { transform: translateY(0) rotate(0); } 50% { transform: translateY(-14px) rotate(180deg); } }
.title-logo {
  font-size: clamp(34px, 8vw, 64px); font-weight: 900; letter-spacing: .06em; margin: 8px 0 0;
  background: linear-gradient(180deg, #fff 30%, var(--accent) 100%);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.title-sub { color: var(--sub); margin: 6px 0 28px; letter-spacing: .2em; }
.title-menu { display: flex; flex-direction: column; gap: 12px; width: min(320px, 100%); }
.title-menu .btn { padding: 14px; font-size: 16px; }
.title-note { color: var(--sub); font-size: 12px; margin-top: 28px; }

/* ---------- キャラ作成 ---------- */
.create { max-width: 900px; margin: 0 auto; padding: 24px 16px 60px; }
.create h1 { font-size: 24px; margin: 0 0 4px; }
.create h3 { margin: 26px 0 10px; font-size: 16px; color: var(--accent); }
.create .lead { color: var(--sub); margin: 0 0 12px; }
.name-row { display: flex; gap: 8px; }
.name-row input {
  flex: 1; min-width: 0; padding: 10px 12px; font-size: 16px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--bg2); color: var(--text); font-family: inherit;
}
.opt-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 10px; }
.opt {
  text-align: left; padding: 12px 14px; border-radius: var(--radius); border: 2px solid var(--line);
  background: var(--card); color: var(--text); cursor: pointer; transition: border-color .15s, background .15s;
}
.opt:hover { border-color: #3f7a63; }
.opt.sel { border-color: var(--accent); background: #1c3d31; }
.opt .t { font-weight: 700; font-size: 16px; display: flex; align-items: center; gap: 8px; }
.opt .d { color: var(--sub); font-size: 13px; margin-top: 4px; }
.opt .tag { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: var(--card2); color: var(--accent2); }
.create .start { margin-top: 30px; text-align: center; }

/* ---------- メイン ---------- */
.topbar {
  position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 12px;
  padding: 10px 16px; background: rgba(9,20,16,.92); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px);
}
.topbar .logo { font-weight: 900; letter-spacing: .05em; font-size: 15px; }
.topbar .date { flex: 1; text-align: center; font-weight: 700; color: var(--accent2); }
.layout {
  max-width: 1100px; margin: 0 auto; padding: 16px; display: grid;
  grid-template-columns: 340px 1fr; gap: 16px; align-items: start;
}
.card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; margin-bottom: 14px;
}
.card h4 { margin: 0 0 10px; font-size: 13px; color: var(--sub); letter-spacing: .08em; font-weight: 700; }

.pc-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.ovr {
  width: 64px; height: 64px; flex: none; border-radius: 50%; display: flex; flex-direction: column;
  align-items: center; justify-content: center; background: radial-gradient(circle, #245a45, #11271f);
  border: 2px solid var(--accent); line-height: 1.1;
}
.ovr b { font-size: 24px; }
.ovr span { font-size: 10px; color: var(--sub); }
.pc-name { font-size: 18px; font-weight: 800; }
.pc-meta { color: var(--sub); font-size: 12px; }
.badge {
  display: inline-block; padding: 1px 8px; border-radius: 6px; font-size: 12px; font-weight: 700;
  background: var(--accent); color: #062014; margin-right: 4px;
}
.badge.gold { background: var(--accent2); }
.badge.gray { background: #3a5249; color: var(--text); }

.stat { display: grid; grid-template-columns: 78px 1fr 30px; align-items: center; gap: 8px; font-size: 13px; margin: 3px 0; }
.stat .n { color: var(--sub); }
.stat .v { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat.key .n { color: var(--text); font-weight: 700; }
.bar { height: 8px; background: #0c1a15; border-radius: 99px; overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 99px; background: linear-gradient(90deg, #2a9d63, var(--accent)); }
.bar.fat i { background: linear-gradient(90deg, #f5c542, #ff6b6b); }
.bar.gold i { background: linear-gradient(90deg, #b8912a, var(--accent2)); }
.bar.blue i { background: linear-gradient(90deg, #2d6fb0, var(--info)); }

.cond { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.cond .stat { grid-template-columns: 64px 1fr 26px; }
.form { font-weight: 700; }
.form.f1 { color: #ff6b6b; } .form.f2 { color: #ffa36b; } .form.f3 { color: var(--text); } .form.f4 { color: #9df0b9; } .form.f5 { color: var(--accent); }
.injury { color: var(--danger); font-weight: 700; }
.rec { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; text-align: center; margin-top: 12px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rec b { display: block; font-size: 18px; }
.rec span { font-size: 11px; color: var(--sub); }

.outlook { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); font-size: 13px; }
.outlook .o-t { font-weight: 800; }
.outlook.starter .o-t { color: var(--accent); }
.outlook.bench .o-t { color: var(--accent2); }
.outlook.out .o-t { color: #ff9f7a; }

.rival { display: flex; align-items: center; gap: 12px; }
.rival .ovr { width: 48px; height: 48px; border-color: #ff9f7a; }
.rival .ovr b { font-size: 18px; }

/* 予定 */
.sched { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
.sched div { display: flex; gap: 10px; }
.sched .when { color: var(--sub); width: 92px; flex: none; }
.sched .now { color: var(--accent2); font-weight: 700; }
.sched .off { color: var(--accent); }
.hint { margin-top: 8px; font-size: 12px; color: var(--accent2); }

/* 行動 */
.actions { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
.act {
  text-align: left; padding: 12px; border-radius: var(--radius); border: 1px solid var(--line);
  background: var(--card2); color: var(--text); cursor: pointer; transition: border-color .15s, transform .08s;
}
.act:hover { border-color: var(--accent); }
.act:active { transform: scale(.98); }
.act .t { font-weight: 800; font-size: 15px; }
.act .d { font-size: 12px; color: var(--sub); margin-top: 2px; }
.act .e { font-size: 11px; color: var(--accent2); margin-top: 4px; }
.act.sel { border-color: var(--accent); background: #1c3d31; }
.drills { margin-top: 12px; padding: 12px; border-radius: var(--radius); background: var(--bg2); border: 1px dashed var(--line); }
.drills .actions { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }

/* ログ */
.log { max-height: 340px; overflow-y: auto; font-size: 13px; }
.log div { padding: 5px 0; border-bottom: 1px solid rgba(255,255,255,.04); }
.log .d { color: var(--sub); font-size: 11px; margin-right: 8px; }
.log .good { color: #9df0b9; }
.log .bad { color: #ffa9a9; }
.log .big { color: var(--accent2); font-weight: 700; }

/* ---------- モーダル ---------- */
.modal {
  position: fixed; inset: 0; z-index: 50; background: rgba(3,8,6,.78);
  display: flex; align-items: center; justify-content: center; padding: 16px;
  animation: fade .2s ease;
}
.modal.hidden { display: none; }
@keyframes fade { from { opacity: 0; } to { opacity: 1; } }
.modal-box {
  width: min(640px, 100%); max-height: calc(100vh - 32px); overflow-y: auto;
  background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 22px;
  box-shadow: 0 20px 60px rgba(0,0,0,.5); animation: pop .22s ease;
}
@keyframes pop { from { transform: translateY(12px) scale(.98); opacity: 0; } to { transform: none; opacity: 1; } }
.modal-box h2 { margin: 4px 0 12px; font-size: 20px; }
.ev-tag { display: inline-block; font-size: 11px; letter-spacing: .15em; color: var(--accent2); border: 1px solid var(--accent2); padding: 1px 8px; border-radius: 99px; }
.ev-body p { margin: 0 0 10px; }
.ev-result { margin-top: 12px; padding: 12px; border-radius: 10px; background: var(--bg2); border-left: 3px solid var(--accent); }
.delta { color: var(--accent2); font-size: 13px; font-weight: 700; }
.choices { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.btn.choice { flex-direction: column; align-items: flex-start; text-align: left; padding: 12px 14px; }
.btn.choice small { color: var(--sub); font-size: 12px; font-weight: 400; }

/* ---------- 試合 ---------- */
.m-comp { text-align: center; color: var(--sub); font-size: 13px; }
.scoreboard {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 10px;
  margin: 10px 0 14px; padding: 14px; border-radius: 12px;
  background: linear-gradient(180deg, #0e241c, #0a1a14); border: 1px solid var(--line);
}
.scoreboard .team { font-weight: 800; font-size: 15px; }
.scoreboard .team.away { text-align: right; }
.scoreboard .sc { font-size: 34px; font-weight: 900; letter-spacing: .1em; font-variant-numeric: tabular-nums; }
.scoreboard .min { grid-column: 1 / -1; text-align: center; color: var(--accent2); font-size: 12px; margin-top: -6px; }
.m-role { text-align: center; margin-bottom: 10px; font-size: 14px; }
.m-lines { max-height: 260px; overflow-y: auto; font-size: 13px; background: var(--bg2); border-radius: 10px; padding: 8px 12px; }
.m-lines div { padding: 4px 0; }
.m-lines .min { display: inline-block; width: 34px; color: var(--sub); font-variant-numeric: tabular-nums; }
.m-lines .goal { color: var(--accent2); font-weight: 700; }
.m-lines .me { color: #9df0b9; }
.m-lines .ok { color: var(--accent); font-weight: 700; }
.m-lines .ng { color: #ffa9a9; font-weight: 700; }
.m-lines .bad { color: #ffa9a9; }
.m-lines .ht { color: var(--sub); text-align: center; }
.moment { margin-top: 14px; padding: 14px; border-radius: 12px; border: 2px solid var(--accent2); background: #2a2612; }
.moment .mt { font-weight: 800; margin-bottom: 10px; }
.moment .drama { color: var(--danger); font-weight: 900; }
.prob { font-size: 11px; padding: 1px 8px; border-radius: 99px; background: rgba(0,0,0,.3); margin-left: 6px; }
.m-rate { text-align: center; margin: 10px 0; }
.m-rate .big { font-size: 48px; font-weight: 900; color: var(--accent2); line-height: 1; }
.m-res { text-align: center; font-size: 22px; font-weight: 900; margin: 6px 0; }
.m-res.win { color: var(--accent); } .m-res.lose { color: var(--danger); } .m-res.draw { color: var(--sub); }
.m-sum { text-align: center; color: var(--sub); font-size: 13px; }
.m-news { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); text-align: center; font-weight: 700; }

/* ---------- エンディング ---------- */
.ending { max-width: 820px; margin: 0 auto; padding: 30px 16px 60px; }
.end-hero { text-align: center; padding: 30px 16px; border-radius: 16px; background: linear-gradient(180deg, #1d3f33, #10221c); border: 1px solid var(--line); margin-bottom: 16px; }
.end-hero .small { color: var(--sub); letter-spacing: .2em; font-size: 12px; }
.end-hero .name { font-size: 26px; font-weight: 900; margin: 6px 0; }
.end-hero .ttl { font-size: 20px; color: var(--accent2); font-weight: 800; }
.end-hero .rank { font-size: 64px; font-weight: 900; line-height: 1; margin-top: 10px; color: var(--accent); }
.end-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; text-align: center; }
.end-grid div { background: var(--bg2); border-radius: 10px; padding: 10px; }
.end-grid b { display: block; font-size: 22px; }
.end-grid span { font-size: 12px; color: var(--sub); }
table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
.tbl th, .tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: center; }
.tbl th { color: var(--sub); font-weight: 700; }
.timeline div { padding: 5px 0 5px 14px; border-left: 2px solid var(--accent); margin-left: 4px; font-size: 13px; }
.timeline .d { color: var(--sub); font-size: 11px; margin-right: 6px; }
.epi { font-size: 15px; line-height: 1.9; }
.muted { color: var(--sub); }

/* ---------- トースト ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%) translateY(20px);
  background: #0d231b; border: 1px solid var(--accent); color: var(--text); padding: 10px 18px;
  border-radius: 12px; font-size: 13px; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60;
  max-width: calc(100% - 32px);
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

/* ---------- レスポンシブ ---------- */
@media (max-width: 820px) {
  .layout { grid-template-columns: 1fr; padding: 12px; }
  .topbar .logo { display: none; }
  .topbar .date { text-align: left; }
  .modal-box { padding: 18px 16px; }
  .scoreboard .sc { font-size: 28px; }
}

/* ---------- v2 追加 ---------- */
.opt.dis { opacity: .35; cursor: not-allowed; }
.opt-grid.four { grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); }
.btn.big { padding: 14px 40px; font-size: 17px; }
.num {
  width: 56px; height: 64px; flex: none; border-radius: 10px; display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: linear-gradient(180deg, #f5f5f0, #d9ddd6); color: #0b1512; line-height: 1;
}
.num span { font-size: 10px; font-weight: 700; opacity: .6; }
.num b { font-size: 28px; color: #0b1512; font-weight: 900; }
.pf-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; font-size: 13px; }
.pf { display: flex; flex-direction: column; padding: 6px 10px; background: var(--bg2); border-radius: 8px; min-width: 0; }
.pf span { color: var(--sub); font-size: 11px; }
.pf b { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.bar.stam i { background: linear-gradient(90deg, #ff6b6b, #f5c542 35%, var(--accent) 70%); }
.cond .stat { grid-template-columns: 84px 1fr 26px; }
.next-week {
  display: flex; flex-direction: column; width: 100%; margin-top: 14px; padding: 18px; font-size: 22px; font-weight: 900;
  letter-spacing: .08em; border-radius: 14px; box-shadow: 0 6px 24px rgba(61,220,132,.25);
}
.next-week small { font-size: 12px; font-weight: 700; letter-spacing: 0; opacity: .75; margin-top: 2px; }
.howto h4 { margin: 14px 0 4px; color: var(--accent); font-size: 14px; }
.howto p { margin: 0 0 6px; font-size: 14px; }
.title-menu .btn:disabled { opacity: .45; }

/* ---------- v3 追加 ---------- */
.act:disabled { opacity: .35; cursor: not-allowed; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { padding: 8px 12px; border-radius: 99px; border: 1px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; font-size: 13px; }
.chip b { color: var(--accent2); margin-left: 4px; }
.chip.sel { border-color: var(--accent); background: #1c3d31; }
.report { border-left: 3px solid var(--accent2); }
.report .delta { margin-top: 4px; font-weight: 400; }
table.league { font-size: 12px; }
.league td, .league th { padding: 4px 3px; }
.league .l { text-align: left; }
.league tr.me td { background: rgba(61,220,132,.12); color: #fff; font-weight: 700; }
.pre { display: flex; flex-direction: column; gap: 8px; }
.pre-row { display: grid; grid-template-columns: 110px 1fr; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px; background: var(--bg2); }
.pre-row > span { color: var(--sub); font-size: 12px; }
.pre-row .stat { grid-template-columns: 0 1fr 30px; margin: 0; }
.pred.s { color: var(--accent); } .pred.sb { color: #9df0b9; } .pred.b, .pred.bo { color: var(--accent2); } .pred.o, .pred.x { color: #ff9f7a; }
.m-role.lineup { padding: 18px 0 6px; }
.big-role { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
.m-stats { display: grid; grid-template-columns: 110px 1fr; gap: 12px; align-items: center; margin-top: 8px; }
.tbl.stats th { text-align: left; width: 40%; }
.tbl.stats td { text-align: right; font-weight: 700; }
.m-eval { display: flex; justify-content: center; gap: 16px; flex-wrap: wrap; margin-top: 10px; font-size: 14px; }
.m-eval .up { color: var(--accent); } .m-eval .down { color: var(--danger); }
@media (max-width: 520px) { .m-stats { grid-template-columns: 1fr; } .pre-row { grid-template-columns: 1fr; gap: 4px; } }

/* ---------- v4 追加 ---------- */
.bar.xp { position: relative; }
.bar.xp em { position: absolute; left: 0; bottom: 0; height: 2px; background: rgba(255,255,255,.75); border-radius: 99px; }
.lvup { color: var(--accent); font-weight: 800; }
.tl { display: inline-block; min-width: 22px; text-align: center; font-weight: 900; border-radius: 6px; padding: 0 6px; color: #0b1512; background: #9bb5aa; }
.tl.t-S { background: linear-gradient(135deg, #ffe27a, #f5a142); } .tl.t-A { background: #3ddc84; } .tl.t-B { background: #5fb3ff; } .tl.t-C { background: #9bb5aa; }
.tl.big { font-size: 28px; padding: 4px 14px; border-radius: 10px; }
.talent-box { display: flex; align-items: center; gap: 14px; padding: 12px 14px; border-radius: var(--radius); background: var(--card); border: 1px solid var(--line); flex-wrap: wrap; }
.talent-box > div { flex: 1; min-width: 180px; }
.ladder { display: flex; align-items: center; gap: 4px; margin: 8px 0; flex-wrap: wrap; }
.ladder span { color: var(--sub); }
.ladder .step { font-size: 11px; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--sub); }
.ladder .step.past { color: var(--text); border-color: #3f7a63; }
.ladder .step.on { background: var(--accent); color: #062014; border-color: var(--accent); font-weight: 800; }
.vs { margin-top: 10px; display: grid; gap: 4px; font-size: 12px; }
.vs div { display: flex; justify-content: space-between; gap: 8px; padding: 6px 10px; background: var(--bg2); border-radius: 8px; }
.vs span { color: var(--sub); }
.m-news.down { color: #ffa9a9; }

/* ---------- v5 追加：演出・セーブ・エンディング ---------- */
.modal-box.epic { border-color: var(--accent2); box-shadow: 0 0 0 1px rgba(245,197,66,.35), 0 20px 60px rgba(0,0,0,.55), 0 0 40px rgba(245,197,66,.18); }
.modal-box.drama { animation: pop .22s ease, pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 0%,100% { box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 0 rgba(255,107,107,.0); } 50% { box-shadow: 0 20px 60px rgba(0,0,0,.5), 0 0 0 6px rgba(255,107,107,.25); } }
.modal-box { position: relative; }
.fx-banner {
  position: absolute; left: 50%; top: 38%; transform: translate(-50%, -50%) rotate(-6deg); z-index: 5; pointer-events: none;

/* =========================================================
   v6 見やすさ改善（コントラスト・文字サイズ・情報の整理）
   ========================================================= */
:root {
  --bg: #0a1411; --bg2: #0f1f1a; --card: #14271f; --card2: #1b3429; --line: #2f5446;
  --text: #f1f7f3; --sub: #b9cec5; --accent: #3ddc84; --accent2: #ffcf4d;
}
body { font-size: 16px; line-height: 1.65; }
.card { padding: 16px 18px; border-radius: 14px; margin-bottom: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.25); }
.card h4 { font-size: 14px; color: var(--accent); letter-spacing: .06em; margin: 0 0 12px; padding-left: 10px; border-left: 3px solid var(--accent); text-transform: none; }
.muted, .note { color: var(--sub); }
.note { font-size: 13px; margin-top: 10px; line-height: 1.6; }

/* トップバー */
.topbar { gap: 14px; padding: 10px 18px; }
.topbar .date { display: flex; flex-direction: column; align-items: center; line-height: 1.3; color: var(--text); }
.topbar .date b { font-size: 15px; color: var(--accent2); }
.topbar .date span { font-size: 12px; color: var(--sub); }
.topbar .money { font-weight: 800; font-size: 15px; white-space: nowrap; }

/* レイアウト：PCは2列、スマホは「選手 → 行動 → 能力 → タブ」の順 */
.layout2 { max-width: 1120px; margin: 0 auto; padding: 16px; display: grid; gap: 0 18px;
  grid-template-columns: 380px 1fr; grid-template-areas: "hero plan" "stats plan" "stats tabs" ". tabs"; align-items: start; }
.a-hero { grid-area: hero; } .a-plan { grid-area: plan; } .a-stats { grid-area: stats; } .a-tabs { grid-area: tabs; }
@media (max-width: 900px) {
  .layout2 { grid-template-columns: 1fr; grid-template-areas: "hero" "plan" "stats" "tabs"; padding: 12px; }
  .topbar .logo { display: none; }
  .topbar .date { align-items: flex-start; flex: 1; }
}

/* ヒーローカード */
.hero-top { display: flex; align-items: center; gap: 14px; }
.hero-name { flex: 1; min-width: 0; }
.hero .pc-name { font-size: 22px; line-height: 1.3; }
.hero-sub { font-size: 13px; color: var(--sub); }
.hero .ovr { width: 70px; height: 70px; }
.hero .ovr b { font-size: 28px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.chip2 { flex: 1 1 calc(50% - 8px); display: flex; justify-content: space-between; align-items: center; padding: 8px 12px; border-radius: 10px; background: var(--bg2); border: 1px solid var(--line); font-size: 14px; }
.chip2 span { color: var(--sub); font-size: 13px; }
.chip2 b { font-size: 16px; }
.chip2.good { border-color: #2f8a5b; } .chip2.good b { color: var(--accent); }
.chip2.bad { border-color: #8a3a3a; background: #2a1414; } .chip2.bad b { color: #ff8c8c; }
.chip2.mid b { color: var(--text); }
.hint-line { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); line-height: 1.55; }
.alert { margin-top: 12px; padding: 10px 12px; border-radius: 10px; font-size: 14px; font-weight: 700; }
.alert.bad { background: #2a1414; border: 1px solid #8a3a3a; color: #ffb3b3; }
.nextup { display: flex; gap: 10px; align-items: center; margin: -4px 0 14px; padding: 10px 14px; border-radius: 12px; background: linear-gradient(90deg, #2a2610, #14271f); border: 1px solid #6b5a1a; font-weight: 700; font-size: 15px; }
.nextup span { flex: none; font-size: 12px; padding: 2px 10px; border-radius: 99px; background: var(--accent2); color: #1a1400; }

/* 能力値 */
.stat { grid-template-columns: 96px 1fr 34px; font-size: 14px; margin: 7px 0; gap: 10px; }
.stat .v { font-size: 16px; }
.stat.key .n { color: #fff; }
.bar { height: 10px; background: #081410; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 18px; }
@media (max-width: 520px) { .grid2 { grid-template-columns: 1fr; } }

/* 先週の出来事 */
.report { border-left: 4px solid var(--accent2); padding: 12px 16px; }
.report-h { font-size: 12px; font-weight: 800; color: var(--accent2); letter-spacing: .08em; }
.report-h span { color: var(--sub); font-weight: 400; margin-left: 6px; }
.report-t { font-weight: 800; font-size: 15px; margin-top: 2px; }
.report-x { font-size: 13px; color: var(--accent2); margin-top: 2px; line-height: 1.6; }
.report-d { font-size: 13px; color: var(--sub); margin-top: 4px; }

/* 行動ボタン：アイコン＋名前＋効果の3行を大きく */
.actions2 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .actions2 { grid-template-columns: repeat(2, 1fr); } }
.act2 { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 12px 6px; border-radius: 12px; border: 2px solid var(--line); background: var(--card2); color: var(--text); cursor: pointer; font-family: inherit; transition: border-color .15s, background .15s, transform .08s; }
.act2:hover { border-color: #4f9b78; }
.act2:active { transform: scale(.97); }
.act2 .ic { font-size: 24px; line-height: 1.2; }
.act2 .nm { font-weight: 800; font-size: 15px; }
.act2 .ef { font-size: 12px; color: var(--accent2); }
.act2.sel { border-color: var(--accent); background: #1f4a37; box-shadow: 0 0 0 3px rgba(61,220,132,.2); }
.act2:disabled { opacity: .35; cursor: not-allowed; }
.plan-desc { margin-top: 12px; font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--bg2); line-height: 1.6; }
.chip { font-size: 14px; padding: 8px 14px; }
.next-week { font-size: 22px; padding: 16px; }
.next-week small { font-size: 13px; }

/* タブ */
.tabs { display: flex; gap: 4px; overflow-x: auto; margin: -4px -4px 14px; padding-bottom: 2px; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { flex: 1 0 auto; padding: 8px 14px; border: none; border-bottom: 3px solid transparent; background: transparent; color: var(--sub); font-family: inherit; font-size: 14px; font-weight: 700; cursor: pointer; }
.tab.on { color: var(--accent); border-bottom-color: var(--accent); }
.tab-body { min-height: 120px; }
.tab-body .outlook { margin-top: 0; margin-bottom: 12px; font-size: 14px; }
.vs-tbl th, .vs-tbl td { padding: 8px; font-size: 14px; }
.vs-tbl th:first-child { text-align: left; color: var(--sub); }
.sched { font-size: 14px; gap: 6px; }
.sched .school { color: #8fc8ff; }
.log { font-size: 14px; max-height: 420px; }

/* モーダル（イベント・試合）も読みやすく */
.modal-box { font-size: 15px; }
.ev-body p { line-height: 1.8; }
.btn.choice { padding: 14px 16px; }
.btn.choice b { font-size: 15px; }
.btn.choice small { font-size: 13px; }
.m-lines { font-size: 14px; }

/* =========================================================
   v7 PC：スクロールなしで1画面に収める（3列ダッシュボード）
   左：選手＋能力値 ／ 中央：先週の出来事＋今週の行動 ／ 右：タブ
   画面が低い場合も、ページ全体ではなく各列の中だけがスクロールする
   ========================================================= */
@media (min-width: 1000px) {
  .main-screen { height: 100vh; display: flex; flex-direction: column; overflow: hidden; }
  .main-screen .topbar { position: static; flex: none; padding: 8px 18px; }
  .layout2 {
    flex: 1; min-height: 0; width: 100%; max-width: 1480px; margin: 0 auto; padding: 12px 16px; gap: 12px 14px;
    grid-template-columns: 330px minmax(0, 1fr) 390px; grid-template-rows: auto minmax(0, 1fr);
    grid-template-areas: "hero plan tabs" "stats plan tabs";
  }
  .a-hero, .a-stats, .a-plan, .a-tabs { min-height: 0; }
  .a-stats, .a-plan { overflow-y: auto; scrollbar-width: thin; padding-right: 2px; }
  .a-tabs { display: flex; flex-direction: column; }
  .a-tabs .tabs-card { flex: 1; min-height: 0; display: flex; flex-direction: column; margin: 0; }
  .a-tabs .tab-body { flex: 1; min-height: 0; overflow-y: auto; scrollbar-width: thin; padding-right: 4px; }
  .a-tabs .log { max-height: none; }
  .a-stats .card, .a-plan .card:last-child { margin-bottom: 0; }

  /* 1画面に収めるための詰め */
  .main-screen .card { padding: 12px 14px; margin-bottom: 10px; }
  .main-screen .card h4 { margin-bottom: 8px; }
  .hero .ovr { width: 60px; height: 60px; } .hero .ovr b { font-size: 24px; }
  .hero .num { width: 50px; height: 56px; } .hero .num b { font-size: 24px; }
  .hero .pc-name { font-size: 19px; }
  .chips { margin-top: 10px; gap: 6px; }
  .chip2 { padding: 6px 10px; }
  .hint-line, .alert { margin-top: 10px; padding: 8px 10px; font-size: 13px; }
  .nextup { margin: 0 0 10px; padding: 8px 12px; font-size: 14px; }
  .a-stats .stat { margin: 5px 0; }
  .a-stats .note { margin-top: 6px; font-size: 12px; }
  .report { padding: 10px 14px; }
  .actions2 { gap: 8px; }
  .act2 { padding: 9px 6px; }
  .act2 .ic { font-size: 21px; }
  .plan-desc { margin-top: 10px; padding: 8px 12px; font-size: 13px; }
  .drills { margin-top: 10px; padding: 10px; }
  .chip { padding: 6px 12px; font-size: 13px; }
  .next-week { margin-top: 10px; padding: 12px; font-size: 20px; }
  .plan .btns { margin-top: 8px; }
  .tab { padding: 6px 10px; font-size: 13px; }
}
/* 横幅はあるが画面の高さが低いPC（ノートPCなど）はさらに詰める */
@media (min-width: 1000px) and (max-height: 760px) {
  .hero-sub:last-child { display: none; }
  .hint-line { display: none; }
  .report-d { display: none; }
  .a-stats .note { display: none; }
  .a-stats .stat { margin: 3px 0; }
  .bar { height: 8px; }
  .act2 { flex-direction: row; justify-content: center; gap: 6px; padding: 8px 6px; }
  .act2 .ef { display: none; }
  .act2 .ic { font-size: 18px; }
  .next-week { padding: 10px; font-size: 18px; }
}

/* ---------- 成長（経験値制） ----------
   練習・試合・イベントで能力ごとに経験値（EXP）が入り、必要量に達すると能力値が+1。
   能力が高いほど必要EXPが増え、素質（才能）と年齢で獲得EXPが変わる。 */
const TALENTS = {
  genius: { name: '天才型', icon: '✨', desc: '試合で一気に伸び、見せ場でひらめく。反面、練習では伸びにくく、調子の波が激しい。', train: .85, match: 1.5, start: 3 },
  hard: { name: '努力型', icon: '💪', desc: '練習の成果が出やすく、学年が上がるほど伸びる大器晩成。反面、初期能力は低く、試合での伸びは控えめ。', train: 1.3, match: .9, start: -3, late: true },
  physical: { name: 'フィジカル型', icon: '🏃', desc: 'スピード・フィジカル・スタミナが伸びやすく、疲れにくく怪我にも強い。反面、シュート・パス・ドリブルは伸びにくい。', train: 1, match: 1, start: 0, stat: { spd: 1.4, phy: 1.4, sta: 1.4, sho: .8, pas: .8, dri: .8 } },
  tech: { name: '技術型', icon: '🎯', desc: 'シュート・パス・ドリブル・GK能力が伸びやすく、見せ場で強い。反面、体力面は伸びにくく、疲れやすい。', train: 1, match: 1, start: 0, stat: { sho: 1.35, pas: 1.35, dri: 1.35, gk: 1.35, spd: .8, phy: .8, sta: .8 } },
  stable: { name: '安定型', icon: '🛡', desc: '調子が大きく崩れず、怪我をしにくい。反面、成長速度は標準で、大化けはしない。', train: 1, match: 1, start: 0 },
};
function talent() { return TALENTS[S.p.talent]; }
// 年齢補正：若いほど伸びる（努力型は逆に学年が上がるほど伸びる）
function ageMult() { const i = clamp(ageAt(weekDate()) - 15, 0, 3); return talent().late ? [1, 1.04, 1.08, 1.12][i] : [1.08, 1.04, 1, .96][i]; }
function xpNeed(v) { return 5 + v * v / 220; }
function growthMult(k, src = 'train') { const t = talent(); let m = (src === 'match' ? t.match : src === 'train' ? t.train : 1) * ((t.stat && t.stat[k]) || 1) * ageMult(); if (k === style().main) m *= 1.15; return m; }
function grow(k, amt, g, src = 'train') {
  const p = S.p; p.xp = p.xp || {};
  const xp = amt * 12.3 * growthMult(k, src);
  p.xp[k] = (p.xp[k] || 0) + xp; let up = 0;
  while (p.st[k] < 100 && p.xp[k] >= xpNeed(p.st[k])) { p.xp[k] -= xpNeed(p.st[k]); p.st[k]++; up++; }
  if (p.st[k] >= 100) { p.st[k] = 100; p.xp[k] = 0; }
  if (g) { g[k] = g[k] || { xp: 0, up: 0 }; g[k].xp += xp; g[k].up += up; }
  return up;
}
function fmtGains(g) {
  const e = Object.entries(g).filter(([, v]) => v.xp >= .5);
  if (!e.length) return '';
  const xp = 'EXP ' + e.map(([k, v]) => `${statName(k)}+${Math.round(v.xp)}`).join('・');
  const ups = e.filter(([, v]) => v.up).map(([k, v]) => `<span class="lvup">▲${statName(k)} ${S.p.st[k] - v.up}→${S.p.st[k]}</span>`).join(' ');
  return xp + (ups ? ' ' + ups : '');
}
// ポジション・プレースタイルで重み付けして能力を選ぶ
function posPick(n) {
  const p = S.p, w = POSITIONS[p.pos].w, stl = style();
  let keys = STAT_KEYS.filter(k => p.pos === 'GK' || k !== 'gk'); const res = [];
  for (let i = 0; i < n; i++) {
    const k = weightedPick(keys, x => (w[x] || 0) + .03 + (stl.main === x ? .12 : stl.sub === x ? .05 : 0));
    res.push(k); keys = keys.filter(x => x !== k);
  }
  return res;
}

const LABELS = { coach: '監督評価', trust: 'チーム内評価', fame: '人気', grades: '学業', friends: '友人関係' };
function apply(d) {
  const p = S.p, out = [], g = {};
  if (d.st) for (const k in d.st) grow(k, d.st[k], g, d.src || 'event');
  const gs = fmtGains(g); if (gs) out.push(gs);
  for (const k of ['coach', 'trust', 'fame', 'grades', 'friends']) {
    if (!d[k]) continue;
    const b = p[k]; p[k] = clamp(p[k] + d[k], 0, 100);
    const diff = Math.round(p[k] - b); if (diff) out.push(`${LABELS[k]}${diff > 0 ? '+' : ''}${diff}`);
  }
  if (d.fatigue) {
    const tf = d.fatigue > 0 ? ({ physical: .9, tech: 1.1 }[p.talent] || 1) : 1;
    const b = p.fatigue; p.fatigue = clamp(p.fatigue + d.fatigue * tf, 0, 100);
    const diff = Math.round(p.fatigue - b); if (diff) out.push(`疲労${diff > 0 ? '+' : ''}${diff}`);
  }
  if (d.money) { p.money = Math.max(0, p.money + d.money); out.push(`所持金${d.money > 0 ? '+' : ''}${yen(d.money)}`); }
  if (d.form) { const b = p.form; p.form = clamp(p.form + d.form, 1, 5); if (p.form !== b) out.push(`コンディション${p.form > b ? '↑' : '↓'}`); }
  return out.join(' / ');
}

function weekDate(y = S.year, w = S.week, sy = S.startYear) {
  const d = new Date(sy + y - 1, 3, 6);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7) + w * 7);
  return d;
}
const WD = ['日', '月', '火', '水', '木', '金', '土'];
function fmtDate(d) { return `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${WD[d.getDay()]}）`; }
function shortDate(y = S.year, w = S.week) { const d = weekDate(y, w); return `${d.getMonth() + 1}/${d.getDate()}`; }
function dateLabel(y = S.year, w = S.week) { return `${y}年 ${shortDate(y, w)}`; }
function ageAt(d) {
  const b = S.p.birth; let a = d.getFullYear() - b.y;
  if (d.getMonth() + 1 < b.m || (d.getMonth() + 1 === b.m && d.getDate() < b.d)) a--;
  return a;
}
function log(x, c = '') { S.log.unshift({ d: dateLabel(), x, c }); if (S.log.length > 100) S.log.pop(); }

  S = {

    p: { name: c.name, pos: c.pos, foot: c.foot, style: c.style, talent: c.talent, depth: 0, recent: [], xp: {}, injLen: 0, friends: 40, gear: 60, birth: { y: by, m: bm, d: bd }, st: {}, fatigue: 10, form: 3, injury: 0, grades: 55, coach: 45, trust: 40, fame: sc.startFame + (c.foot === 'L' ? 3 : 0), money: 3000, number: 0 },
    rival: { name: '', ovr: 0, pot: rand(.9, 1.2), form: 3, injury: 0, recent: [] }, plan: { id: 'normal', stat: null }, report: null, league: null,
    rec: { apps: 0, starts: 0, goals: 0, assists: 0, rsum: 0, rn: 0, offApps: 0, offGoals: 0, mom: 0, best: 0, byYear: {} },
    out: {}, qual: {}, flags: {}, titles: [], results: [], hl: [], log: [], sch: null, match: null, phase: 'main',
  };
  const w = POSITIONS[c.pos].w, stl = STYLES[c.style];
  for (const k of STAT_KEYS) S.p.st[k] = 20 + randi(0, 8) + (w[k] || 0) * 45 + TALENTS[c.talent].start;
  S.p.st.gk = c.pos === 'GK' ? 36 + randi(0, 5) : randi(3, 12);
  S.p.st[stl.main] += 7; S.p.st[stl.sub] += 3;
  if (c.foot === 'L') S.p.st.pas += 2;
  for (const k of STAT_KEYS) { S.p.st[k] = Math.round(clamp(S.p.st[k], 0, 55)); S.p.xp[k] = rand(0, xpNeed(S.p.st[k]) * .6); }
  do { S.rival.name = randName(); } while (S.rival.name === c.name);
  S.rival.ovr = ovr() + sc.rivalOff + rand(-1, 2);
  for (const y of [1, 2, 3]) S.rec.byYear[y] = { apps: 0, goals: 0, assists: 0, rsum: 0, rn: 0 };
  S.p.depth = Math.min(targetDepth('league'), 1);
  assignNumber(true);
  log(`${sc.name}に入学。サッカー人生の始まりだ。`, 'big');
  beginTurn();
}

/* ---------- 背番号 ---------- */
function assignNumber(silent) {
  const p = S.p, d = p.depth, old = p.number;
  let n;
  if (d === 3) {
    if ((p.pos === 'FW' || p.pos === 'MF') && (p.fame >= 60 || S.flags.captain)) n = 10;
    else n = pick({ GK: [1], DF: [2, 3, 4, 5], MF: [6, 7, 8], FW: [9, 11] }[p.pos]);
  } else if (d >= 1) n = p.pos === 'GK' ? pick([12, 17]) : randi(13, 20);
  else n = S.school === 'elite' ? randi(30, 99) : randi(21, 30);
  p.number = n;
  if (!silent && n !== old) log(`背番号が${n}番に決まった。`, n <= 11 ? 'good' : '');
  return n;
}

/* =========================================================
   スケジュール（1年＝52週。第1週は4月上旬）
   ========================================================= */
const LEAGUE_WEEKS = [2, 4, 6, 8, 10, 13, 15, 18, 20, 21, 24, 26, 28, 30];
function canSummerSelect() { return S.p.fame >= 30 && ovr() >= 45; }
/* ---------- キャリアステージ（将来の拡張ポイント） ----------
   今は高校編のみ。プロ編・海外編・代表編などは、ここにステージを追加し、
   年数・週ごとの予定・終了処理を差し替える想定（S.stage で切り替え）。 */
const STAGES = {
  highschool: { name: '高校編', years: 3, schedule: (y, w) => highschoolSchedule(y, w), finalEvent: 'graduation' },
  // pro: { name: 'プロ編', years: 15, schedule: (y, w) => proSchedule(y, w), finalEvent: 'retire' },
};
function getSchedule(y = S.year, w = S.week) { return STAGES[S.stage || 'highschool'].schedule(y, w); }
function highschoolSchedule(y = S.year, w = S.week) {
  const M = (comp, round = 0) => ({ kind: 'match', comp, round });
  const E = id => ({ kind: 'event', id });
  const F = { kind: 'free' };
  if (LEAGUE_WEEKS.includes(w)) return M('league', LEAGUE_WEEKS.indexOf(w));
  switch (w) {
    case 0: return E(y === 1 ? 'enroll' : 'newyear');
    case 3: case 33: case 49: return M('friendly');
    case 5: case 7: case 9: return S.out.ih_pref ? F : M('ih_pref', (w - 5) / 2);
    case 12: case 35: case 47: return (y === 3 && w === 47) ? F : E('test');
    case 16: return E('camp');
    case 17: return S.qual.ih_nat ? M('ih_nat') : F;
    case 19: return canSummerSelect() ? E('summer_select') : F;
    case 22: return E('sports_day');
    case 23: return y === 3 ? E('career_talk') : F;
    case 25: return E('culture_fest');
    case 44: return y === 2 ? E('career_survey') : F;
    case 27: case 29: case 31: return S.out.sen_pref ? F : M('sen_pref', (w - 27) / 2);
    case 38: return S.qual.sen_nat ? M('sen_nat') : F;
    case 40: return y === 3 ? E('graduation') : F;
    case 41: return y < 3 ? M('shinjin', 0) : F;
    case 43: return y < 3 && !S.out.shinjin ? M('shinjin', 1) : F;
    case 45: return S.p.fame >= 28 ? E('winter_select') : M('friendly');
    case 51: return E('yearend');
  }
  return F;
}
function schedLabel(y, w) {
  if (y === 3 && w === 23) return '進路面談';
  if (y === 3 && w === 40) return '進路決定・卒業';
  if (y === 3 && w > 40) return '';
  if (LEAGUE_WEEKS.includes(w)) return `${LEAGUE_NAMES[S.school]} 第${LEAGUE_WEEKS.indexOf(w) + 1}節`;
  if (y === 2 && w === 44) return '進路希望調査';
  const L = { 0: '新学期', 22: '体育祭', 25: '文化祭', 39: 'お正月', 3: '練習試合', 5: 'インターハイ県予選 準々決勝', 7: 'インターハイ県予選 準決勝', 9: 'インターハイ県予選 決勝', 12: '1学期 期末テスト', 16: '夏合宿', 17: 'インターハイ本戦（出場時）', 19: 'トレセン・代表合宿（選出時）', 27: '選手権県予選 準々決勝', 29: '選手権県予選 準決勝', 31: '選手権県予選 決勝', 33: '練習試合', 35: '2学期 期末テスト', 38: '選手権本戦（出場時）', 41: '新人戦 準決勝', 43: '新人戦 決勝', 45: '県選抜 or 練習試合', 47: '学年末テスト', 49: '練習試合', 51: '年度末' };
  return L[w] || '';
}

/* =========================================================
   高校リーグ（8チーム・ホーム＆アウェイ14節）
   ========================================================= */
const LEAGUE_NAMES = { elite: 'プリンスリーグ', mid: '県高校リーグ1部', weak: '県高校リーグ2部' };
function newLeague() {
  const sc = SCHOOLS[S.school], names = new Set([sc.short]);
  const teams = [{ name: sc.short, str: sc.strength, me: true }];
  while (teams.length < 8) { const n = genSchool().replace(/高$/, '高校'); if (names.has(n)) continue; names.add(n); teams.push({ name: n, str: sc.strength + randi(-10, 7) }); }
  teams.forEach(t => Object.assign(t, { p: 0, w: 0, d: 0, l: 0, gf: 0, ga: 0, pts: 0 }));
  let arr = shuffle([...Array(8).keys()]); const rounds = [];
  for (let r = 0; r < 7; r++) {
    const pairs = []; for (let i = 0; i < 4; i++) pairs.push(r % 2 ? [arr[7 - i], arr[i]] : [arr[i], arr[7 - i]]);
    rounds.push(pairs); arr = [arr[0], arr[7], ...arr.slice(1, 7)];
  }
  S.league = { name: LEAGUE_NAMES[S.school], teams, rounds: rounds.concat(rounds.map(rd => rd.map(([a, b]) => [b, a]))), round: 0 };
}
function leagueRecord(a, b, ga, gb) {
  const T = S.league.teams, A = T[a], B = T[b];
  A.p++; B.p++; A.gf += ga; A.ga += gb; B.gf += gb; B.ga += ga;
  if (ga > gb) { A.w++; B.l++; A.pts += 3; } else if (ga < gb) { B.w++; A.l++; B.pts += 3; } else { A.d++; B.d++; A.pts++; B.pts++; }
}
function poisson(l) { const L = Math.exp(-l); let k = 0, p = 1; do { k++; p *= Math.random(); } while (p > L); return k - 1; }
function simLeagueOthers(round) {
  const T = S.league.teams;
  for (const [a, b] of S.league.rounds[round]) {
    if (T[a].me || T[b].me) continue;
    const d = T[a].str - T[b].str;
    leagueRecord(a, b, poisson(clamp(1.3 + d * .035, .2, 3.2)), poisson(clamp(1.3 - d * .035, .2, 3.2)));
  }
}
function standings() { return S.league.teams.map((t, i) => ({ ...t, i })).sort((x, y) => y.pts - x.pts || (y.gf - y.ga) - (x.gf - x.ga) || y.gf - x.gf); }
function rankOfTeam(i) { return standings().findIndex(t => t.i === i) + 1; }
function myRank() { return standings().findIndex(t => t.me) + 1; }
function leagueOpp(round) {
  const T = S.league.teams, me = T.findIndex(t => t.me);
  const pr = S.league.rounds[round].find(([a, b]) => a === me || b === me);
  const oi = pr[0] === me ? pr[1] : pr[0];
  return { i: oi, t: T[oi], home: pr[0] === me, me };
}

/* =========================================================
   メンバー選考（序列）
   0 メンバー外 → 1 ベンチ → 2 途中出場 → 3 スタメン
   公式戦ごとに1段階ずつ上下する。怪我・疲労・不調・ライバルの成長で下がることもある。
   ========================================================= */
const DEPTH = [
  { t: 'メンバー外', s: 'メンバー外', cls: 'out' }, { t: 'ベンチ', s: 'ベンチ', cls: 'bench' },
  { t: '途中出場の切り札', s: '途中出場', cls: 'bench' }, { t: 'スタメン', s: 'スタメン', cls: 'starter' },
];
const avg = a => a && a.length ? a.reduce((x, y) => x + y, 0) / a.length : null;
function seniorAdj(comp) { return comp === 'shinjin' ? ({ 1: -2, 2: 3 }[S.year] || 0) : ({ 1: -8, 2: -3, 3: 2 }[S.year]); }
// 直近の評価点をライバルと比べた差（ライバルより活躍すると有利）
function perfDiff() { const a = avg(S.p.recent), b = avg(S.rival.recent); return a === null || b === null ? 0 : clamp((a - b) * 2.5, -6, 6); }
function effScore(comp) {
  const p = S.p;
  return ovr() + (p.coach - 50) * .12 + (p.form - 3) * 1.5 + (p.trust - 50) * .04 + seniorAdj(comp) + (S.flags.captain ? 2 : 0) + perfDiff() - Math.max(0, p.fatigue - 60) * .12;
}
function rivalEff(comp) { const r = S.rival; return r.injury > 0 ? -99 : r.ovr + seniorAdj(comp) + (r.form - 3) * 1.5 + 1; }
function targetDepth(comp, noise = 0) {
  const sc = SCHOOLS[S.school], e = effScore(comp) + noise;
  if (e >= sc.starter && e >= rivalEff(comp)) return 3;
  if (e >= sc.starter - 4) return 2;
  if (e >= sc.bench) return 1;
  return 0;
}
function downReason() {
  const p = S.p, r = S.rival;
  if (p.fatigue >= 65) return '疲労で動きが重い';
  if (p.form <= 2) return '不調が続いている';
  if (r.ovr > ovr() + 1) return `${r.name}の成長`;
  if (perfDiff() < -1) return `${r.name}の活躍`;
  return '監督評価の低下';
}
// 公式戦のたびに序列を1段階ずつ動かす
function updateDepth(comp) {
  const p = S.p, t = targetDepth(comp, rand(-1.5, 1.5)), before = p.depth;
  if (t > p.depth) {
    const last = (p.recent || []).slice(-1)[0];
    if (p.depth === 2 && last !== undefined && last < 6.3) return { msg: '監督はまだ様子を見ている。途中出場で結果を出せば、スタメンが見えてくる。' };
    p.depth++;
  } else if (t < p.depth) p.depth--;
  if (p.depth === before) return null;
  const up = p.depth > before;
  const msg = up ? `序列が「${DEPTH[before].t}」→「${DEPTH[p.depth].t}」に上がった！` : `序列が「${DEPTH[before].t}」→「${DEPTH[p.depth].t}」に下がった…（${downReason()}）`;
  log(msg, up ? 'good' : 'bad');
  if (up && p.depth === 3 && !S.flags.firstStart) { S.flags.firstStart = true; S.flags.firstStartY = S.year; hl('初めてスタメンの座をつかんだ'); }
  if (!up && before === 3) { hl(`スタメン落ち（${downReason()}）`); S.rec.drops = (S.rec.drops || 0) + 1; }
  return { msg, up };
}
function roleOf(comp) {
  const p = S.p, c = COMPS[comp];
  if (p.injury > 0) return { role: 'injured' };
  if (S.flags.banned && c.official) return { role: 'banned' };
  const info = c.official ? updateDepth(comp) : null;
  let d = p.depth;
  if (!c.official) { if (d === 0) return { role: 'starter', bteam: true }; d = Math.min(3, d + 1); }
  return { role: d === 3 ? 'starter' : d >= 1 ? 'bench' : 'out', super: d === 2, info };
}
function depthHint() {
  const p = S.p, sc = SCHOOLS[S.school], e = effScore('league'), t = targetDepth('league');
  if (p.injury > 0) return `負傷中（あと${p.injury}週）。長引くと復帰後はベンチからの再スタートになることも。`;
  if (p.depth === 3) return t < 3 ? `⚠ 評価が落ちている（${downReason()}）。このままだとスタメンを失うかも。` : '監督の信頼を得ている。結果を出し続けよう。';
  if (t > p.depth) return '評価は上がっている。次の公式戦で序列アップのチャンス！';
  if (p.depth === 2) return e >= sc.starter ? `${esc(S.rival.name)}とのスタメン争い。途中出場で結果を出せ。` : `スタメンまで評価あと${Math.ceil(sc.starter - e)}ほど。`;
  if (p.depth === 1) return `途中出場の切り札まで評価あと${Math.max(1, Math.ceil(sc.starter - 4 - e))}ほど。`;
  return `ベンチ入りまで評価あと${Math.max(1, Math.ceil(sc.bench - e))}ほど。${S.year === 1 ? '1年生は先輩の壁も厚い。' : ''}`;
}

/* ---------- 怪我（確率は低め。疲労が高いほど上がる） ---------- */
function injuryRisk(mult = 1) { const p = S.p, f = p.fatigue; const t = { physical: .7, stable: .75 }[p.talent] || 1; return f < 55 ? 0 : Math.pow(f - 55, 1.5) * .0004 * mult * t * (p.gear < 30 ? 1.2 : 1); }
function riskLabel(mult = 1) { const r = injuryRisk(mult); return r < .005 ? '低' : r < .03 ? '中' : '高'; }
function injure(src, weeks) {
  const p = S.p;
  weeks = weeks || weightedPick([1, 2, 3, 4, 5, 6], w => [35, 28, 17, 10, 6, 4][w - 1]);
  p.injury = weeks; p.injLen = weeks; p.form = Math.max(1, p.form - 1); S.rec.inj = (S.rec.inj || 0) + 1;
  let drop = '';
  if (weeks >= 3 && chance(.5)) { const k = pick(['spd', 'sta', 'phy']), n = weeks >= 5 ? 2 : 1; p.st[k] = Math.max(0, p.st[k] - n); drop = `（${statName(k)}-${n}）`; }
  const name = weeks <= 1 ? '軽い捻挫' : weeks <= 2 ? '打撲' : weeks <= 4 ? '肉離れ' : '靭帯損傷';
  log(`${src}で負傷…${name}、全治${weeks}週。${drop}`, 'bad'); hl(`${name}（全治${weeks}週）`);
  return `<br><span class="bad">⚠ ${src}で負傷……${name}、全治${weeks}週${drop}</span>`;
}
function checkInjury(mult = 1) { return chance(injuryRisk(mult)) ? injure('練習中') : ''; }

/* =========================================================
   週の進行
   ========================================================= */
function beginTurn() {
  S.phase = 'main'; S.match = null; UI.drill = false;
  const p = S.p, d = weekDate(), notes = [];
  // 月初めのお小遣い
  if (S.week === 0 || weekDate(S.year, S.week - 1).getMonth() !== d.getMonth()) { p.money += 3000; notes.push(`お小遣い +${yen(3000)}`); }
  // 誕生日
  const bday = new Date(d.getFullYear(), p.birth.m - 1, p.birth.d), end = new Date(d); end.setDate(end.getDate() + 7);
  if (bday >= d && bday < end) { p.money += 3000; notes.push(`${p.birth.m}月${p.birth.d}日、${ageAt(end)}歳の誕生日！ 家族から +${yen(3000)}`); log(`${ageAt(end)}歳の誕生日。`, 'good'); if (p.friends >= 50) { p.form = Math.min(5, p.form + 1); notes.push('友達がサプライズで祝ってくれた！'); } }
  // 背番号の見直し（新学期・夏明け）
  if (S.week === 0 && (!S.league || S.league.round > 0 || S.year > 1 && S.league.year !== S.year)) newLeague();
  if (S.league) S.league.year = S.year;
  if (S.week === 0 && S.year > 1 && !S.flags['ys' + S.year]) { S.flags['ys' + S.year] = true; const b = S.p.depth; S.p.depth = Math.min(targetDepth('league'), S.p.depth + 1); if (S.p.depth !== b) log(`新チームでの序列は「${DEPTH[S.p.depth].t}」。`, S.p.depth > b ? 'good' : 'bad'); if (S.p.depth === 3 && !S.flags.firstStart) { S.flags.firstStart = true; S.flags.firstStartY = S.year; hl('新チームでスタメンの座をつかんだ'); } }
  if (S.week === 0 || S.week === 20) assignNumber();
  if (S.week === 39) { p.money += 5000; notes.push(`お年玉 +${yen(5000)}`); }
  if (notes.length) setTimeout(() => toast(notes.join('<br>')), 50);
  S.sch = getSchedule();
  if (!planAvailable(S.plan.id)) S.plan = { id: 'rest', stat: S.plan.stat };
  saveTo('auto');
  presentWeek();
}
// 週の表示（ロード時もここから再開する。週開始の処理は二重に行わない）
function presentWeek() {
  S.phase = 'main'; S.match = null;
  renderMain();
  const sch = S.sch;
  if (sch.kind === 'event' && !sch.actionOk) runFixedEvent(sch.id);
  else if (sch.kind === 'match') startMatch(sch.comp, sch.round);
}

function endTurn() {
  const p = S.p;
  p.fatigue = clamp(p.fatigue - (6 + p.st.sta * .05 + (p.talent === 'physical' ? 2 : 0)), 0, 100);
  p.grades = clamp(p.grades - .3, 0, 100);
  p.coach = clamp(p.coach - .15, 0, 100);
  p.fame = clamp(p.fame - .15, 0, 100);
  if (p.injury > 0) {
    p.injury--;
    if (p.injury === 0) {
      let x = '';
      if (p.injLen >= 3 && p.depth >= 2) { p.depth = Math.max(1, p.depth - 1); x = `離脱中に${S.rival.name}が定着し、序列は「${DEPTH[p.depth].t}」から再スタート。`; }
      log('怪我が完治した！ピッチに戻れる。' + x, 'good');
    }
  }
  if (p.talent === 'genius') { if (chance(.25)) p.form += pick([-1, 1]); }
  else if (chance(.15)) p.form += p.form > 3 ? -1 : p.form < 3 ? 1 : pick([-1, 1]);
  if (p.friends < 25 && chance(.1)) { p.form -= 1; log('学校で少し孤立している気がする……。', 'bad'); }
  if (p.fatigue > 75 && chance(.25)) p.form -= 1;
  p.form = clamp(p.form, p.talent === 'stable' ? 2 : 1, 5);
  p.friends = clamp(p.friends - .12, 0, 100);
  // ライバルも毎週成長し、調子の波や怪我がある
  const r = S.rival;
  if (r.injury > 0) { r.injury--; if (!r.injury) log(`ライバルの${r.name}が怪我から復帰した。`); }
  else if (chance(.006)) { r.injury = randi(2, 5); log(`ライバルの${r.name}が負傷！全治${r.injury}週。チャンスだ。`, 'good'); }
  if (chance(.18)) r.form = clamp(r.form + (r.form > 3 ? -1 : r.form < 3 ? 1 : pick([-1, 1])), 1, 5);
  if (!r.injury) r.ovr = Math.min(88, r.ovr + (.125 + Math.random() * .095) * (1.35 - r.ovr / 100) * r.pot);
  S.week++;
  if (S.week >= WEEKS) { S.week = 0; S.year++; S.out = {}; S.qual = {}; }
  beginTurn();
}


/* ---------- 今週の行動（6種類） ---------- */
const PLANS = {

function trainable() { return STAT_KEYS.filter(k => S.p.pos === 'GK' || k !== 'gk'); }
const ACTIONS = {

  focus(k) {
    const sc = SCHOOLS[S.school], g = {};
    grow(k, rand(1.3, 1.7) * sc.growth, g);
    S.p.gear = Math.max(0, S.p.gear - 2);
    return { t: `重点練習（${statName(k)}）で徹底的に鍛えた。`, d: `${fmtGains(g)} / ${apply({ fatigue: 20, coach: 1 })}`, inj: checkInjury(1.6) };
  },
  self(k) {
    const g = {};
    grow(k, rand(.8, 1.1), g);
    S.p.gear = Math.max(0, S.p.gear - 1);
    return { t: `自主練習（${statName(k)}）に取り組んだ。`, d: `${fmtGains(g)} / ${apply({ fatigue: 12, coach: .5 })}`, inj: checkInjury() };
  },
  rest() {
    const p = S.p; let extra = '';
    if (p.injury > 1 && chance(.4)) { p.injury--; extra = '（怪我の回復が早まった）'; }
    const lazy = p.fatigue < 15 && p.injury === 0;
    return { t: `しっかり休んだ。${extra}`, d: apply({ fatigue: -30, form: chance(.6) ? 1 : 0, coach: lazy ? -1.5 : 0 }) + (lazy ? '（元気なのに休んだので、監督は少し不満そうだ）' : '') };
  },
  friends() { return { t: 'チームメイトと過ごした。', d: apply({ fatigue: -5, trust: 3, fame: .6, friends: 1, form: chance(.3) ? 1 : 0 }) }; },
  study() { return { t: '勉強に励んだ。', d: apply({ grades: rand(4, 7), fatigue: -3 }) }; },

function planAvailable(id) { return S.p.injury > 0 ? ['rest', 'study', 'friends'].includes(id) : true; }
function planRisk() { const m = { normal: 1, self: 1, focus: 1.6 }[S.plan.id]; if (!m || S.p.injury > 0) return ''; const l = riskLabel(m); return `　怪我リスク：${l}`; }
function planLabel() { const pl = S.plan, v = PLANS[pl.id]; return v.stat ? `${v.name}（${pl.stat ? statName(pl.stat) : '能力を選択'}）` : v.name; }

const DAILY = ['放課後のグラウンドに夕日が差し込む。', '部室でくだらない話をして笑った。', '雨上がりのピッチは少し重かった。', '通学路で近所の子どもに「サッカーの人だ」と言われた。', '昼休み、購買のパンを買い損ねた。', 'ボールの手入れをしながら、次の試合のことを考えた。', '夜、Jリーグの試合をテレビで観た。', 'スパイクの紐を新しいものに替えた。', '授業中、ついフォーメーションを落書きしていた。'];

// 「次の週へ」：行動を実行し、週の出来事（イベント）を発生させる
function nextWeek() {
  const sch = S.sch;
  if (S.phase !== 'main' || !sch || !(sch.kind === 'free' || sch.actionOk)) return;
  if (!planAvailable(S.plan.id)) S.plan = { id: 'rest', stat: S.plan.stat };
  const pl = S.plan;
  if (PLANS[pl.id].stat && !pl.stat) { toast('伸ばす能力を選んでください'); return; }
  const r = ACTIONS[pl.id](pl.stat);
  S.report = { d: dateLabel(), t: r.t, x: r.d + (r.inj || ''), daily: pick(DAILY) };
  log(`${r.t} ${r.d}`.replace(/<[^>]+>/g, '') + (r.inj ? ' ⚠負傷' : ''), r.inj ? 'bad' : '');
  S.sch = { kind: 'done' };
  if (chance(.3)) {
    const pool = RANDOM_EVENTS.filter(e => e.c());
    if (pool.length) { renderMain(); const e = weightedPick(pool, x => x.w); const ev = e.b(); ev.tag = ev.tag || '今週の出来事'; showEvent(ev, endTurn); return; }
  }
  endTurn();
}

function buy(id) {
  const it = SHOP[id], p = S.p;
  if (p.money < it.price) { toast('所持金が足りない…'); return; }
  p.money -= it.price;
  const r = it.f();
  log(`${it.name}を購入（${yen(it.price)}）。${r}`);
  toast(`${it.name}を購入！<br>${r}`);
  renderMain(); renderShop();
}

  if (r.offApps === 0) type = pick(['最後までピッチの外から戦い続けた選手', 'スタンドからチームを支え続けた選手']);
  else if (p.pos === 'FW' && r.goals >= 25) type = pick(['ゴールの匂いを嗅ぎ分ける生粋の点取り屋', '県内のDFを震え上がらせたストライカー']);
  else if (r.assists >= 15) type = pick(['味方を輝かせることに長けた司令塔', '決定的なパスで試合を動かすチャンスメーカー']);
  else if (p.pos === 'GK' && avgR >= 6.5) type = pick(['最後尾で何度もチームを救った守護神', '『あいつがいれば負けない』と言わしめたGK']);
  else if (p.pos === 'DF' && avgR >= 6.5) type = pick(['最終ラインを統率した鉄壁のディフェンダー', '相手エースを封じ続けた守備の要']);
  else if (avgR >= 7) type = '出場するたびに高い評価を得た、安定感抜群のプレーヤー';
  else if (S.flags.captain) type = 'プレーと言葉でチームを引っ張ったリーダー';
  else type = pick([`${stl}として粘り強く戦った選手`, `泥臭く、最後まで走り続けた${p.pos}`]);
  out.push(pick([`${n}は、${sch}で「${type}」だった。`, `${sch}の背番号${p.number}、${n}。一言で表すなら「${type}」だ。`, `${sch}サッカー部の${n}――${type}として、3年間を駆け抜けた。`]));
  const fy = S.flags.firstStartY;
  if (!fy) out.push(r.apps > 0 ? pick(['スタメンの壁は最後まで厚かったが、出番が来るたびに全力でピッチを駆けた。', 'レギュラーには届かなかった。それでも、ベンチから送り続けた声はチームの力になっていた。']) : '公式戦のピッチに立つ日は来なかった。それでも最後まで練習を休まなかったことを、仲間は知っている。');
  else if (fy === 1) out.push(pick(['1年生にしてスタメンの座をつかみ、周囲を驚かせた。', '入学早々に頭角を現し、1年からチームの主力となった。']));
  else if (fy === 2) out.push(pick(['1年目はベンチで悔しさを噛みしめたが、2年でついにレギュラーの座を勝ち取った。', '途中出場で結果を積み重ね、2年でスタメンを手にした。']));
  else out.push(pick(['スタメンをつかんだのは最後の1年。遅咲きの花は、最後に大きく咲いた。', '2年間の下積みを経て、3年でようやくスタメンに。その粘り強さこそが武器だった。']));
  const b = r.bestMatch;
  if (b && b.r >= 7) out.push(pick([`ハイライトは${b.y}年の${b.t}、${b.opp}戦。${b.g ? `${b.g}ゴール` : b.a ? `${b.a}アシスト` : '攻守にわたる活躍'}で評価${b.r.toFixed(1)}を記録した一戦は、今も部の語り草だ。`, `最高の試合を挙げるなら、${b.y}年の${b.opp}戦だろう。評価${b.r.toFixed(1)}――あの日のプレーは本物だった。`]));
  const nat = S.titles.filter(t => t.includes('優勝') && (t.includes('選手権') || t.includes('インターハイ')));
  if (nat.length) out.push(pick([`${nat[0].replace(/^\d年 /, '')}で頂点に立ち、日本一の景色を見た。`, '全国の舞台で頂点に立った経験は、何物にも代えがたい財産になった。']));
  else if (S.results.some(x => x.res === '優勝' && x.comp.includes('予選'))) out.push(pick(['県予選を勝ち抜き、全国の舞台にも立った。', '県の頂点に立ち、全国大会のピッチを踏んだ。']));
  else if (S.titles.some(t => t.includes('リーグ') && t.includes('優勝'))) out.push('リーグ戦では頂点に立ち、1年を通しての強さを証明した。');
  if (S.titles.some(t => t.includes('U-17'))) out.push('世代別代表候補にも名を連ね、全国区の選手として注目された。');
  const rv = S.rival, diff = ovr() - rv.ovr;
  out.push(diff >= 3 ? pick([`同じポジションの${esc(rv.name)}とは最後まで競い合い、最後は実力で上回った。`, `${esc(rv.name)}との定位置争いを制したことが、成長の何よりの証だ。`]) : diff <= -3 ? pick([`同じポジションの${esc(rv.name)}の背中を、最後まで追い続けた。その悔しさは、きっと次の舞台で生きる。`, `${esc(rv.name)}という高い壁があったからこそ、ここまで走り続けられた。`]) : pick([`${esc(rv.name)}とは最後まで互角。最高のライバルだった。`, `${esc(rv.name)}と火花を散らした3年間が、2人を大きく成長させた。`]));
  if ((r.inj || 0) >= 3 || (r.drops || 0) >= 2) out.push(pick(['怪我やスタメン落ちにも見舞われたが、そのたびに立ち上がった。', '順風満帆ではなかった。何度も壁にぶつかり、そのたびに這い上がった。']));
  if (p.friends >= 65) out.push(pick(['ピッチの外でも友人に恵まれ、教室ではいつも輪の中心にいた。', 'クラスの仲間たちも、いつもスタンドから声援を送ってくれた。']));
  else if (p.friends < 30) out.push('サッカーに打ち込むあまり、教室では少し孤独な時間もあった。');
  if (p.grades >= 70) out.push('勉強も手を抜かず、文武両道を貫いた。');
  else if (p.grades < 35) out.push(pick(['テストのたびに頭を抱えたのは、ご愛嬌だ。', '勉強は……正直、最後まで苦手だった。']));
  out.push({ genius: pick(['天性のセンスは、大舞台でこそ輝いた。', 'ひらめきに満ちたプレーは、見る者をいつも驚かせた。']), hard: pick(['才能よりも、積み重ねた練習の量がすべてを支えた。', '誰よりもボールを蹴り続けた日々が、確かな力になった。']), physical: pick(['90分走り切るタフさは、チームの誰にも負けなかった。', '当たり負けしない強さが、最大の武器だった。']), tech: pick(['ボールを持てば何かが起きる――そんな技術の持ち主だった。', '繊細なボールタッチは、チームメイトさえ見惚れるほどだった。']), stable: pick(['大崩れしない安定感で、監督からの信頼は厚かった。', 'どんな試合でも計算できる選手、それが最大の評価だった。']) }[p.talent]);
  const aim = S.flags.aim, path = S.ending.o.id;
  if (aim === 'pro' && ['j1', 'j2', 'j3'].includes(path)) out.push('2年の春に書いた「プロサッカー選手」という夢を、自分の足でつかみ取った。');
  else if (aim === 'pro') out.push('プロという夢には、まだ届いていない。けれど、物語はここで終わりではない。');
  out.push(S.ending.epi);
  return out;
}

/* ---------- メイン ---------- */
function statRow(label, v, cls = '', key = false, max = 100) {
  return `<div class="stat ${key ? 'key' : ''}"><span class="n">${label}</span><div class="bar ${cls}"><i style="width:${clamp(v / max * 100, 0, 100)}%"></i></div><span class="v">${Math.floor(v)}</span></div>`;
}
function statRowXP(k, key) {
  const p = S.p, v = p.st[k], x = clamp(((p.xp && p.xp[k]) || 0) / xpNeed(v) * 100, 0, 100);
  return `<div class="stat ${key ? 'key' : ''}"><span class="n">${statName(k)}${k === style().main ? ' ★' : ''}</span><div class="bar xp"><i style="width:${v}%"></i><em style="width:${x}%"></em></div><span class="v">${v}</span></div>`;
}
// 値に応じた色（良い/普通/注意）
const tone = (v, good, bad, inverse) => inverse ? (v >= bad ? 'bad' : v >= good ? 'mid' : 'good') : (v >= good ? 'good' : v <= bad ? 'bad' : 'mid');
function chip(label, val, t = 'mid') { return `<div class="chip2 ${t}"><span>${label}</span><b>${val}</b></div>`; }

function renderMatch() {

  if (m.fx) { h += `<div class="fx-banner">${m.fx}</div>`; m.fx = null; }

  if (m.stage === 'pre') {
    const dv = m.oppStr - (m.teamBase0 + (ovr() - 50) * .3);
    const lv = dv > 8 ? '格上' : dv > 2 ? 'やや格上' : dv > -3 ? '互角' : dv > -9 ? 'やや格下' : '格下';
    const pr = predict(m.comp);
    const lg = COMPS[m.comp].league && S.league.round > 0 ? `（現在 自校${myRank()}位・相手${rankOfTeam(m.oppIdx)}位）` : '';
    h += `<div class="pre">

      <div class="pre-row"><span>監督からの評価</span><div>${statRow('', p.coach, 'gold')}<div class="muted" style="font-size:13px">${coachComment()}</div></div></div>

      <div class="pre-row"><span>コンディション</span><b><span class="form f${p.form}">${FORM_ICONS[p.form]} ${FORM_NAMES[p.form]}</span>　<small class="muted">疲労 ${Math.round(p.fatigue)}${p.fatigue >= 60 ? '（重い）' : ''}</small></b></div>
      <div class="pre-row"><span>ライバル</span><b>${esc(S.rival.name)}　<small class="muted">総合 ${Math.round(S.rival.ovr)}（あなた ${ovr()}）／ ${S.rival.injury > 0 ? '負傷中' : FORM_NAMES[S.rival.form]}${avg(S.rival.recent) !== null ? ` ／ 直近評価 ${avg(S.rival.recent).toFixed(1)}` : ''}</small></b></div>
      ${S.flags.scout ? '<div class="pre-row"><span>注目</span><b>👀 スカウトが観戦に来ている</b></div>' : ''}
      ${S.flags.expect && COMPS[m.comp].official && m.comp !== 'league' ? '<div class="pre-row"><span>期待</span><b>監督に「任せてください」と言った大会だ</b></div>' : ''}
    </div>
    <div class="btns"><button class="btn primary" data-act="announce">メンバー発表へ</button></div>`;
  } else if (m.stage === 'lineup') {
    const d = m.role === 'starter' ? (m.bteam ? 'トップチームには入れないが、ここでのアピールが大切だ。' : `背番号${p.number}を背負って、結果で応えよう。`) : m.role === 'bench' ? '途中出場のチャンスがあるかもしれない。' : 'ピッチには立てない。仲間の戦いを見届けよう。';
    h += `<div class="m-role lineup"><div class="big-role">${roleTxt}</div>${m.superSub && m.role === 'bench' ? '<div class="delta">途中出場の切り札として、出番がありそうだ</div>' : ''}${m.depthInfo && m.depthInfo.up && m.role === 'starter' ? '<div class="stamp">STARTER!</div>' : ''}${m.depthInfo ? `<div class="m-news ${m.depthInfo.up === false ? 'down' : ''}">${m.depthInfo.msg}</div>` : ''}<div class="muted" style="margin-top:6px">${d}</div></div>
      <div class="btns">${(m.role === 'starter' || m.role === 'bench') ? '<button class="btn primary" data-act="kickoff">キックオフ</button>' : '<button class="btn primary" data-act="simAll">試合結果を見る</button>'}</div>`;
  } else if (m.stage === 'play') {
    h += `<div class="m-role">${m.onPitch ? `<b>No.${p.number} ${esc(p.name)}：出場中</b>　評価 ${clamp(m.rating, 0, 10).toFixed(1)}` : roleTxt}</div>` + lines();
    if (m.pending) {
      const mo = m.pending, rate = o => mo.pk ? pkRate(o) : successRate(o);

    if (s.played) {
      const pct = m.passA ? Math.round(m.passS / m.passA * 100) : 0;

      if (p.pos === 'GK') rows.push(['セーブ', m.saves]);
      h += `<div class="m-stats"><div class="m-rate"><div class="muted">評価点</div><div class="big">${s.rating.toFixed(1)}</div><div class="muted" style="font-size:11px">0〜10</div></div>
        <table class="tbl stats">${rows.map(([k, v]) => `<tr><th>${k}</th><td>${v}</td></tr>`).join('')}</table></div>`;
      const sg = v => `<b class="${v > 0 ? 'up' : v < 0 ? 'down' : ''}">${v > 0 ? '+' : ''}${v}</b>`;
      h += `<div class="m-eval"><div>監督評価 ${sg(s.dCoach)}</div><div>人気 ${sg(s.dFame)}</div><div>チーム内評価 ${sg(s.dTrust)}</div></div>`;
    } else h += `<div class="m-sum">スコア ${s.rs}<br>${roleTxt}</div>`;
    if (s.news.length) h += `<div class="m-news">${s.news.join('<br>')}</div>`;
    if (m.rivalLine) h += `<div class="m-sum" style="margin-top:8px">${m.rivalLine}</div>`;
    h += lines(130);
    h += `<div class="btns">${s.next !== null ? '<button class="btn primary" data-act="nextRound">次の試合へ</button>' : '<button class="btn primary" data-act="matchEnd">次の週へ ▶</button>'}</div>`;
  }

  openModal(h, 'match' + (big ? ' epic' : '') + (m.pending && m.drama ? ' drama' : ''));

}

    <p class="muted" style="text-align:center;margin-top:20px;font-size:12px">プロ編・大学編・海外編は今後のアップデートで。</p>
  </div>`;
  window.scrollTo(0, 0);
}

/* ---------- 殿堂 / メニュー / 記録 ---------- */
function renderHof() {
  const h = loadHof();
  openModal(`<h2>殿堂</h2>${h.length ? `<table class="tbl"><tr><th>選手</th><th>高校</th><th>ランク</th><th>進路</th><th>出場/得点</th></tr>${h.map(x => `<tr><td>${esc(x.name)}<br><small class="muted">${x.pos}・${x.title}</small></td><td>${x.school}</td><td><b>${x.rank}</b></td><td style="font-size:12px">${x.path}</td><td>${x.apps}/${x.goals}</td></tr>`).join('')}</table>` : '<p class="muted">まだ誰も卒業していない。</p>'}<div class="btns"><button class="btn" data-act="close">閉じる</button></div>`);
}
function slotLabel(slot) {
  const d = loadFrom(slot);
  if (!d) return '<span class="muted">― 空き ―</span>';
  const dt = weekDate(d.year, d.week, d.startYear);
  return `<b>${esc(d.p.name)}</b>　${SCHOOLS[d.school].short}・${d.p.pos}<br><small class="muted">高校${d.year}年 第${d.week + 1}週（${dt.getMonth() + 1}月${dt.getDate()}日）｜総合 ${ovr(d.p)}｜出場${d.rec.apps} ${d.rec.goals}G</small>`;
}
function renderSave() {
  openModal(`<div class="ev-tag">SAVE GAME</div><h2>セーブ</h2><p class="muted">選手情報・能力値・日付・成績・人間関係・所持金・イベント進行状況をすべて保存します。</p>
    <div class="choices">${['s1', 's2', 's3'].map(k => `<button class="btn choice slot" data-act="saveSlot" data-arg="${k}"><b>${SLOT_NAMES[k]}</b><span>${slotLabel(k)}</span></button>`).join('')}</div>
    <div class="btns"><button class="btn" data-act="menu">戻る</button></div>`);
}
function renderLoad(fromTitle) {
  openModal(`<div class="ev-tag">LOAD GAME</div><h2>ロード</h2>
    <div class="choices">${Object.keys(SLOTS).map(k => `<button class="btn choice slot" data-act="loadSlot" data-arg="${k}" ${loadFrom(k) ? '' : 'disabled'}><b>${SLOT_NAMES[k]}</b><span>${slotLabel(k)}</span></button>`).join('')}</div>
    <div class="btns"><button class="btn" data-act="${fromTitle ? 'close' : 'menu'}">戻る</button></div>`);
}
function renderMenu() {
  openModal(`<h2>メニュー</h2>
    <div class="choices">
      <button class="btn choice" data-act="saveMenu"><b>💾 SAVE GAME</b><small>スロット1〜3に保存（毎週の始めにオートセーブもされます）</small></button>
      <button class="btn choice" data-act="loadMenuIn"><b>📂 LOAD GAME</b><small>保存したデータから再開</small></button>
      <button class="btn choice" data-act="records"><b>📊 これまでの記録</b><small>大会成績・タイトル・歩み</small></button>
      <button class="btn choice" data-act="howto"><b>❓ HOW TO PLAY</b><small>遊び方を見る</small></button>
      <button class="btn choice" data-act="toTitle"><b>🏠 タイトルへ戻る</b><small>今週の始めの状態がオートセーブに残っています</small></button>
      <button class="btn choice" data-act="reset"><b style="color:var(--danger)">🗑 最初からやり直す</b><small>オートセーブを削除して選手作成へ（スロットのデータは残ります）</small></button>
    </div>
    <div class="btns"><button class="btn" data-act="close">閉じる</button></div>`);
}
function renderRecords() {
  const res = S.results.map(x => `<div><span class="d">${x.y}年</span>${x.comp}：${x.res}</div>`).join('') || '<div class="muted">まだなし</div>';
  const t = S.titles.map(x => `<div>🏅 ${x}</div>`).join('') || '<div class="muted">まだなし</div>';
  const h = S.hl.map(x => `<div><span class="d">${x.d}</span>${x.x}</div>`).join('') || '<div class="muted">まだなし</div>';
  openModal(`<h2>これまでの記録</h2><h4 class="muted">大会成績</h4><div class="timeline">${res}</div><h4 class="muted" style="margin-top:14px">タイトル・選出</h4>${t}<h4 class="muted" style="margin-top:14px">歩み</h4><div class="timeline">${h}</div><div class="btns"><button class="btn" data-act="close">閉じる</button></div>`);
}

/* =========================================================
   入力ハンドラ
   ========================================================= */
const ACT = {
  loadMenu() { renderLoad(true); },
  loadMenuIn() { renderLoad(false); },
  saveMenu() { if (S.phase !== 'main') return toast('今はセーブできません'); renderSave(); },
  saveSlot(k) { if (loadFrom(k) && !confirm(`${SLOT_NAMES[k]}に上書きしますか？`)) return; toast(saveTo(k) ? `${SLOT_NAMES[k]}に保存しました` : '保存に失敗しました'); renderSave(); },
  loadSlot(k) { const d = loadFrom(k); if (!d) return; S = d; EV = null; closeModal(); presentWeek(); setTimeout(() => toast(`${SLOT_NAMES[k]}をロードしました`), 60); },
  toCreate() { closeModal(); UI.create = { name: randName(), pos: 'FW', foot: 'R', style: 'striker', school: 'mid', talent: 'hard' }; renderCreate(); },
  toTitle() { EV = null; renderTitle(); },
  howto() { renderHowTo(); },
  randName() { const i = document.getElementById('nameIn'); if (i) { UI.create.name = randName(); i.value = UI.create.name; } },
  pick(arg) { const [g, k] = arg.split(':'); const i = document.getElementById('nameIn'); if (i) UI.create.name = i.value; UI.create[g] = k; renderCreate(); },
  start() { const i = document.getElementById('nameIn'); const n = (i && i.value.trim()) || randName(); UI.create.name = n.slice(0, 12); newGame(UI.create); },
  hof() { renderHof(); },
  close() { closeModal(); },
  menu() { renderMenu(); },
  records() { renderRecords(); },
  reset() { if (confirm('オートセーブを削除して最初からやり直しますか？')) { removeSlot('auto'); S = null; ACT.toCreate(); } },
  plan(id) { S.plan = { id, stat: S.plan.stat || (PLANS[id].stat ? style().main : null) }; renderMain(); },
  stat(k) { S.plan.stat = k; renderMain(); },
  tab(k) { UI.tab = k; renderMain(); },
  announce() { announce(); renderMatch(); },
  next() { nextWeek(); },
  shop() { renderShop(); },
  buy(id) { buy(id); },
  evChoice(i) { const c = EV.ev.choices[+i]; const r = c.f(); if (r === false) return; EV.result = r; if (S && S.phase === 'main') renderMain(); renderEvent(); },
  evOk() { const d = EV.done; EV = null; closeModal(); if (d) d(); },
  kickoff() { S.match.stage = 'play'; line(0, 'キックオフ！', 'ht'); renderMatch(); },
  advance() { advance(); },
  simAll() { const m = S.match; if (m.stage === 'pre') announce(); if (m.stage === 'lineup') { m.stage = 'play'; line(0, 'キックオフ！', 'ht'); } simulateRest(); if (m.finished) finishMatch(); else renderMatch(); },
  moment(i) { resolveMoment(i); },
  matchResult() { finishMatch(); },
  nextRound() { const m = S.match; closeModal(); renderMain(); startMatch(m.comp, m.sum.next); },
  matchEnd() { closeModal(); S.match = null; S.phase = 'main'; S.sch = { kind: 'done' }; endTurn(); },
};
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b || b.disabled) return;
  const f = ACT[b.dataset.act];
  if (f) f(b.dataset.arg);
});
document.addEventListener('input', e => { if (e.target.id === 'nameIn' && UI.create) UI.create.name = e.target.value; });

renderTitle();

</script>
</body>
</html>
